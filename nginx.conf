# /etc/nginx/nginx.conf for Ubuntu 26.04 (nginx 1.28, PHP 8.5).
# This repo is checked out directly into /etc/nginx. Files the Ubuntu package owns
# (mime.types, fastcgi.conf, snippets/, modules-enabled/, ...) stay untracked; see .gitignore.

user www-data;

# Set to number of CPU cores, auto will try to autodetect.
worker_processes auto;

# Maximum open file descriptors per process. Should be greater than worker_connections.
worker_rlimit_nofile 16384;

# File that stores the process ID. Rarely needs changing.
pid /run/nginx.pid;

error_log /var/log/nginx/error.log warn;

# Dynamic modules installed by apt.
include /etc/nginx/modules-enabled/*.conf;

events {
	# Set the maximum number of connection each worker process can open. Anything higher than this
	# will require Unix optimisations.
	worker_connections 4096;

	# Accept all new connections as they're opened.
	multi_accept on;
}

http {
	# HTTP
	include global/http.conf;

	# MIME Types (from the Ubuntu package)
	include mime.types;
	default_type application/octet-stream;

	# Only log errors (4xx/5xx) in the per-site access logs.
	map $status $loggable
	{
		~^[2] 0;
		~^[3] 0;
		default 1;
	}

	# Limits & Timeouts
	include global/limits.conf;

	# Some WP plugins that push large amounts of data via cookies
	# can cause 500 HTTP errors if these values aren't increased.
	# Without them wp-admin gets very slow (commit f6192a6).
	fastcgi_buffers 16 16k;
	fastcgi_buffer_size 32k;

	# Default Logs
	access_log /var/log/nginx/access.log;

	# Gzip
	include global/gzip.conf;

	# exposes configured php pool on $upstream variable
	include global/php-pool.conf;

	# FastCGI page cache. Outside the web root so it can't be browsed, and the
	# Nginx Cache plugin's "Cache Zone Path" must match this path.
	# keys_zone=wordpress:100m is the memory zone used by `fastcgi_cache wordpress;` in the sites.
	# inactive=60m will remove cached items that haven't been accessed for 60 minutes or more.
	fastcgi_cache_path /var/cache/nginx/tc-wordpress levels=1:2 keys_zone=wordpress:100m max_size=2g inactive=60m;

	# Modules
	include /etc/nginx/conf.d/*.conf;

	# Sites
	include /etc/nginx/sites-enabled/*;
}
