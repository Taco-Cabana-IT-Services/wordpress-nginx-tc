# Default server for both environments: drops requests for the raw IP or any hostname
# this server doesn't serve (bots scanning IPs, old DNS names). Without it, nginx would
# answer them with the first site in sites-enabled.
# Enable with: sudo ln -s ../sites-available/catch-all.conf /etc/nginx/sites-enabled/
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    # Refuse TLS for unknown names instead of presenting our certificate.
    ssl_reject_handshake on;

    access_log off;
    return 444;
}
