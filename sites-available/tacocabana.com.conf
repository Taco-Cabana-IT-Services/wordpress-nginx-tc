# PRODUCTION server: www.tacocabana.com + SendGrid link-branding proxies.
# Enable with: sudo ln -s ../sites-available/tacocabana.com.conf /etc/nginx/sites-enabled/
#
# DNS (Oct 2026): www, marketing and email are A records to the prod Elastic IP.
# The apex tacocabana.com goes to CloudFront -> S3, which redirects to https://www. The apex
# blocks below only get traffic if the apex A record is ever pointed at this server.
# orders.tacocabana.com is on Netlify now, so its old S3 proxy block was removed.

# /* -------------------------------------------------------------------------- */

# http to https
server {
    server_name marketing.tacocabana.com *.marketing.tacocabana.com email.tacocabana.com;

    listen 80;
    listen [::]:80;

    return 301 https://$host$request_uri;
}

# Proxy click-tracking via Sendgrid for Punchh emails (system/marketing)
# Make sure DNS records from SendGrid link branding point to server IP via A record
server {
    server_name marketing.tacocabana.com *.marketing.tacocabana.com email.tacocabana.com;

    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    include global/server/ssl.conf;

    access_log /var/log/nginx/sendgrid-proxy.access.log combined if=$loggable;
    error_log /var/log/nginx/sendgrid-proxy.error.log;

    location / {
        proxy_pass https://sendgrid.net;
        proxy_set_header Host $host;
        # Send SNI and check SendGrid's certificate.
        proxy_ssl_server_name on;
        proxy_ssl_name sendgrid.net;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }
}

# /* -------------------------------------------------------------------------- */

# Focus on primary domain now "tacocabana.com"
# Redirect 80 http traffic to https
server {
    listen 80;
    listen [::]:80;

    server_name tacocabana.com www.tacocabana.com;

    return 301 https://www.tacocabana.com$request_uri;
}

# Redirect https apex to www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name tacocabana.com;

    include global/server/ssl.conf;

    return 301 https://www.tacocabana.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # Server name to listen for
    server_name www.tacocabana.com;

    # Path to document root
    root /var/www/html/wordpress;

    # File to be used as index
    index index.php;

    # Per-site logs (rotated by Ubuntu's nginx logrotate).
    error_log /var/log/nginx/tacocabana.com.error.log;
    access_log /var/log/nginx/tacocabana.com.access.log combined if=$loggable;

    # SSL rules
    include global/server/ssl.conf;

    # Default server block rules (exclusions, security headers, static file caching)
    include global/server/defaults.conf;

    # Fastcgi cache rules
    include global/server/fastcgi-cache.conf;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        # Ubuntu's snippet: 404s missing scripts and includes fastcgi.conf,
        # which passes REMOTE_ADDR (the visitor's IP) to PHP.
        include snippets/fastcgi-php.conf;

        # Use the php pool defined in the upstream variable.
        # See global/php-pool.conf for definition.
        fastcgi_pass $upstream;
        fastcgi_read_timeout 120s;

        # Skip cache based on rules in global/server/fastcgi-cache.conf.
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;

        # Define memory zone for caching. Should match keys_zone in fastcgi_cache_path (nginx.conf).
        fastcgi_cache wordpress;

        # Define caching time.
        fastcgi_cache_valid 60m;
    }

    location = /contactus {
        return 301 /contact-us;
    }

    location = /find-a-tc-location {
        return 301 /locations;
    }

    location = /wp-content/uploads/2021/12/Taco_Cabana_Food_Menu_Dec_31st_2021_Web.pdf {
        return 301 /menu;
    }

    # For SEO Framework plugin
    rewrite ^/robots\.txt$ /index.php?robots=1 last;
    rewrite ^/sitemap\.xml$ /index.php?the_seo_framework_sitemap=xml last;
    rewrite ^/sitemap\.xsl$ /index.php?the_seo_framework_sitemap=xsl last;
}
