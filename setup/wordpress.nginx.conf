# Render only TC_HOST and TC_SERVER_NAMES with envsubst; preserve NGINX variables.
# Include through sites-enabled using the distribution's nginx.conf.
fastcgi_cache_path /var/cache/nginx/tc-wordpress levels=1:2
    keys_zone=tc_wordpress:10m inactive=60m max_size=1g;

map $request_method $tc_cache_method {
    default 1;
    GET 0;
    HEAD 0;
}
map $query_string $tc_cache_query {
    default 1;
    "" 0;
}
map $request_uri $tc_cache_uri {
    default 0;
    ~*(/wp-admin|/wp-json|/wp-login|/xmlrpc\.php|/wp-cron\.php|/cart|/checkout|/my-account|/checkpoint|/purge|sitemap|robots\.txt|/feed) 1;
}
map $http_cookie $tc_cache_cookie {
    default 0;
    ~*(wordpress_|wp-postpass|comment_author|woocommerce_|wp_woocommerce_session_|edd_items_in_cart|PHPSESSID) 1;
}
map $http_authorization $tc_cache_auth {
    default 1;
    "" 0;
}
map "$tc_cache_method$tc_cache_query$tc_cache_uri$tc_cache_cookie$tc_cache_auth" $tc_skip_cache {
    default 1;
    "00000" 0;
}

server {
    listen 80;
    listen [::]:80;
    server_name ${TC_SERVER_NAMES};
    return 301 https://${TC_HOST}$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${TC_SERVER_NAMES};

    root /var/www/html/wordpress;
    index index.php;
    client_max_body_size 72m;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/tc-wordpress/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tc-wordpress/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TC_SSL:10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/tc-wordpress.access.log;
    error_log /var/log/nginx/tc-wordpress.error.log;
    add_header X-FastCGI-Cache $upstream_cache_status always;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }
    location = /wp-config.php { deny all; }
    location ^~ /wp-content/updraft/ { deny all; }
    location ^~ /wp-content/ai1wm-backups/ { deny all; }
    location = /wp-content/debug.log { deny all; }
    location ^~ /logs/ { deny all; }
    location ^~ /cache/ { deny all; }
    location ~ /\.(?!well-known/) { deny all; }
    location ~* ^/wp-content/(uploads|cache)/.*\.php(?:/|$) { deny all; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_read_timeout 120s;

        # Change 'off' to 'tc_wordpress' after functional testing.
        fastcgi_cache off;
        fastcgi_cache_key "$scheme$request_method$host$request_uri";
        fastcgi_cache_valid 200 1m;
        fastcgi_cache_bypass $tc_skip_cache;
        fastcgi_no_cache $tc_skip_cache;
        fastcgi_cache_lock on;
        # Preserve PHP's Cache-Control and Set-Cookie behavior.
    }

    location = /contactus { return 301 /contact-us; }
    location = /find-a-tc-location { return 301 /locations; }
    location = /wp-content/uploads/2021/12/Taco_Cabana_Food_Menu_Dec_31st_2021_Web.pdf {
        return 301 /menu;
    }
    rewrite ^/robots\.txt$ /index.php?robots=1 last;
    rewrite ^/sitemap\.xml$ /index.php?the_seo_framework_sitemap=xml last;
    rewrite ^/sitemap\.xsl$ /index.php?the_seo_framework_sitemap=xsl last;
}
