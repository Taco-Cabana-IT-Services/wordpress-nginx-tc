# Production only. Confirm these hostnames/routes against live DNS first.
# Preserve the existing HTTP-only S3 website proxy; HTTPS for this name must
# follow its actual existing edge/origin design.
server {
    listen 80;
    listen [::]:80;
    server_name orders.tacocabana.com;
    location / {
        proxy_pass http://orders.tacocabana.com.s3-website.us-east-2.amazonaws.com;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name marketing.tacocabana.com *.marketing.tacocabana.com email.tacocabana.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name marketing.tacocabana.com *.marketing.tacocabana.com email.tacocabana.com;

    ssl_certificate /etc/letsencrypt/live/tc-proxies/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tc-proxies/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/tc-proxies.access.log;
    error_log /var/log/nginx/tc-proxies.error.log;

    location / {
        proxy_pass https://sendgrid.net;
        proxy_set_header Host $host;
        proxy_ssl_server_name on;
        proxy_ssl_name sendgrid.net;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }
}
