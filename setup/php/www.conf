; Taco Cabana PHP-FPM pool. Replaces Ubuntu's file:
;   sudo install -m 0644 /etc/nginx/setup/php/www.conf /etc/php/8.5/fpm/pool.d/www.conf
; If a later apt upgrade asks about this modified file, keep the installed (local) version.

[www]
user = www-data
group = www-data

listen = /run/php/php8.5-fpm.sock
listen.owner = www-data
listen.group = www-data

pm = dynamic
; PRODUCTION (4 GB): about 2 GB is left for PHP after MySQL (1 GB pool), Redis and the OS.
; WordPress with ACF uses ~80-100 MB per worker, so 16 workers.
; STAGING (2 GB): change max_children to 6 and max_spare_servers to 3.
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recycle workers now and then so slow memory leaks in plugins can't build up.
pm.max_requests = 500

; Kill requests that run longer than PHP's max_execution_time (120s) plus slack.
request_terminate_timeout = 150s

; Log the PHP stack of any request slower than 10s.
slowlog = /var/log/php8.5-fpm-slow.log
request_slowlog_timeout = 10s
