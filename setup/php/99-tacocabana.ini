; Taco Cabana PHP 8.5 settings for PHP-FPM.
; Install: sudo install -m 0644 /etc/nginx/setup/php/99-tacocabana.ini /etc/php/8.5/fpm/conf.d/99-tacocabana.ini

memory_limit = 256M
; Match client_max_body_size 100m in global/limits.conf.
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 120
max_input_time = 120
; ACF page builder: the Home page edit form had 1,156 inputs (STATUS.md). With PHP's
; default of 1000, a save silently drops the fields past the limit.
max_input_vars = 5000

display_errors = Off
log_errors = On
expose_php = Off
date.timezone = America/Chicago

; ~31,700 PHP files in core + plugins + themes. The default max_accelerated_files (10000)
; would keep evicting scripts from the cache.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 40000
; Pick up `git pull` deploys within 2 seconds without restarting PHP.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
; Must stay on for WordPress/ACF annotations.
opcache.save_comments = 1
; JIT doesn't help WordPress and caused issues on the old server.
opcache.jit = disable

; Fewer filesystem lookups with this many files.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
