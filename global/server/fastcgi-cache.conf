# The key to use when saving cache files, which will run through the MD5 hashing algorithm.
fastcgi_cache_key "$scheme$request_method$host$request_uri";

# If an error occurs when communicating with FastCGI server, return cached content.
# Useful for serving cached content if the PHP process dies or timeouts.
fastcgi_cache_use_stale error timeout updating invalid_header http_500 http_503;

# Refresh expired pages in the background, and let one request rebuild a page while
# others wait, instead of every visitor hitting PHP at once.
fastcgi_cache_background_update on;
fastcgi_cache_lock on;

# PHP's Cache-Control, Expires and Set-Cookie headers are respected (the Ubuntu 20.04
# config ignored them). A response that sets a cookie is never cached, so one visitor's
# cookie can't be served to everyone. Live pages send none of these headers, so the hit rate
# is unchanged.

# Show the cache status in server responses.
add_header Fastcgi-Cache $upstream_cache_status;

# Don't skip by default
set $skip_cache 0;

# POST requests and urls with a query string should always go to PHP
if ($request_method = POST) {
	set $skip_cache 1;
}

if ($query_string != "") {
	set $skip_cache 1;
}

# Requests with credentials (Application Passwords for the Support Tickets API, etc.)
if ($http_authorization != "") {
	set $skip_cache 1;
}

# Don't cache URIs containing the following segments
if ($request_uri ~* "/wp-admin/|/purge*|/checkpoint/|/wp-json/|/xmlrpc.php|wp-.*.php|/feed/|index.php|sitemap(_index)?.xml|/cart/|/checkout/|/my-account/") {
	set $skip_cache 1;
}

# Don't use the cache for logged in users or recent commenters
if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in|edd_items_in_cart|woocommerce_items_in_cart|wp_woocommerce_session_") {
	set $skip_cache 1;
}
