# Certificate and TLS settings shared by every HTTPS site on the server.
#
# Certificate: GoDaddy wildcard *.tacocabana.com + tacocabana.com (expires Apr 23 2027).
# On renewal, replace these two files on BOTH servers, run `nginx -t`, and reload nginx.
# BE SURE TO UPDATE AWS CLOUDFRONT DISTRIBUTION SSL CERT AS WELL AS SERVER
# https://stackoverflow.com/questions/63178730/aws-s3-redirect-for-route53-not-working-for-https
ssl_certificate /etc/ssl/certs/tc.com-2027-fullchain.crt;
ssl_certificate_key /etc/ssl/private/threeyear.tacocabana.com.key;

# Use https://www.ssllabs.com/ssltest/ to test.
# nginx 1.28's default ciphers are already modern, so none are listed here.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_tickets off;

# Define the size of the SSL session cache in MBs.
ssl_session_cache shared:SSL:10m;

# Define the time in minutes to cache SSL sessions.
ssl_session_timeout 1h;

# Use HTTPS exclusively for 1 year, uncomment one. Second line applies to subdomains.
add_header Strict-Transport-Security "max-age=31536000;" always;
# add_header Strict-Transport-Security "max-age=31536000; includeSubdomains;" always;
